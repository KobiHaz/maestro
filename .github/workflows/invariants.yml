name: Engineering invariants

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly drift check (Monday 06:00 UTC)
    - cron: "0 6 * * 1"

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run invariant checks
        run: bash scripts/invariants-check.sh
